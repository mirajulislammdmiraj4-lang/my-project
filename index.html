<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Proposal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffe6e9;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }
    .card {
      background: white;
      padding: 35px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
      max-width: 350px;
      width: 90%;
      position: relative;
    }
    h1 {
      color: #ff4d6d;
      font-size: 22px;
      margin-bottom: 30px;
      line-height: 1.4;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 50px;
    }
    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      user-select: none;
    }
    .yes-btn {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
    }
    .no-btn {
      background-color: #e0e0e0;
      color: #333333;
      position: absolute;
      transition: all 0.15s ease-out;
    }
    /* Modal / Pop-up Box */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }
    .modal h2 {
      color: #ff4d6d;
      font-size: 18px;
      margin-bottom: 15px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ffccd5;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }
    .submit-btn {
      background-color: #ff4d6d;
      color: white;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Do you want to go on a date with me? 🤍🌹</h1>
    <div class="btn-container">
      <button class="yes-btn" onclick="openModal()">Yes</button>
      <button class="no-btn" id="noBtn">No</button>
    </div>
  </div>

  <!-- Pop-up Box -->
  <div class="modal" id="dateModal">
    <div class="modal-content">
      <h2>Pick a Date & Time 📅✨</h2>
      <form action="https://formspree.io/f/mdeolzwn" method="POST">
        <label style="font-size: 13px; color: #555; display: block; text-align: left;">Select Date:</label>
        <input type="date" name="date" required>
        
        <label style="font-size: 13px; color: #555; display: block; text-align: left; margin-top: 10px;">Select Time:</label>
        <input type="time" name="time" required>
        
        <button type="submit" class="submit-btn">Submit 💌</button>
      </form>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');

    // No-button runaway logic for Mobile and Desktop
    function moveButton(e) {
      if (e) e.preventDefault();
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 30);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 30);
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    // Runs before click event triggers
    noBtn.addEventListener('touchstart', moveButton, {passive: false});
    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('click', moveButton);

    // Pop-up display logic
    function openModal() {
      document.getElementById('dateModal').style.display = 'flex';
    }
  </script>

</body>
